<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Admin Panel" }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #18202a;
      --muted: #667085;
      --line: #d8dee6;
      --accent: #1f6feb;
      --danger: #c62828;
      --ok: #1b8a5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
    }
    h1, h2, h3 { margin-top: 0; }
    .muted { color: var(--muted); }
    .flash {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eef6ff;
      border: 1px solid #bfd7ff;
    }
    .error {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff1f1;
      border: 1px solid #ffcaca;
      color: var(--danger);
    }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .spacer { flex: 1 1 auto; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 15px;
    }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: #eef2f7;
      color: var(--text);
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-success { background: var(--ok); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { border-color: var(--line); background: white; }
    .filters { margin-bottom: 18px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      text-align: left;
    }
    th { color: var(--muted); font-weight: 600; }
    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .tag-ok { background: #e8f7ef; color: var(--ok); }
    .tag-no { background: #fff1f1; color: var(--danger); }
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
    }
    @media (max-width: 760px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      td {
        border-bottom: none;
        padding: 8px 0;
      }
      tr {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
