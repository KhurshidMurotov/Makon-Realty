[project]
name = "real-estate-scanner"
version = "0.1.0"
description = "Telegram bot + Mini App + OLX scraper"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "aiogram>=3.0,<4.0",
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "playwright>=1.40.0,<2.0",
  "playwright-stealth>=2.0.0,<3.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "python-dotenv>=1.0,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "hypothesis>=6.0,<7.0",
  "itsdangerous>=2.2,<3.0",
  "uvicorn>=0.32,<1.0",
]

[build-system]
requires = ["setuptools>=69,<76", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["real_estate_scanner*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: marks tests that use live external services and are excluded from default pytest runs",
]

